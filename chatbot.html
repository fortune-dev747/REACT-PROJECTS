<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84); 
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;

        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin: 0 auto;

        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        justify-content: start;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .app-welcome-message {
        text-align: center;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);


        function saveInputText(event) {
          setInputText(event.target.value);
        }

        // added async / await features to handle the asynchronous response from the chatbot
        async function sendMessage() {
          if (isLoading || inputText === '') {
            return;
          }
          // Set isLoading to true at the start, and set it to
          // false after everything is done.
          setIsLoading(true);
          // We can put this at the top of the function or
          // after the first setChatMessages(). Both work.
          setInputText(''); // Clear the input field immediately after sending the message

          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

          setChatMessages([
            ...newChatMessages,
            // This creates a temporary Loading... message.
            // Because we don't save this message in newChatMessages,
            // it will be remove later, when we add the response.
            {
              message: 'Loading...',
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);


          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          // Set isLoading to false after everything is done.
          setIsLoading(false);

        }

        function handleKeyDown(event) {
          if (event.key === 'Enter') {
            sendMessage();
          } else if (event.key === 'Escape') {
            setInputText('');
          }
        }

        return (
          <div className="chat-input-container">
            <input 
             placeholder= "Send a message to Chatbot"
             size= "30" 
             onChange={saveInputText}
             value={inputText}  //=> controlled input
             //  onKeyDown => new events prop for both enter and escape key
             onKeyDown={handleKeyDown}
             className="chat-input"
            />
            <button
             onClick={sendMessage}
             className="send-button"
            >Send</button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        // const message = props.message;
        // const sender = props.sender;
        // // shortcut
        // const { message, sender } = props;

        /*
        if (sender === 'robot') {
          return (
            <div>
              <img src= "robot.png" width= "50"/>
              {message}
              
            </div>
          );
        }
        */


        return (
          <div className={
            sender === 'user' 
             ? 'chat-message-user' 
             : 'chat-message-robot'
          }>
            {sender === 'robot' && (
              <img src= "robot.png" 
               className="chat-message-profile"
              />
            )}
            <div className="chat-message-text">
             {message}
            </div>
            {sender === 'user' && (
              <img src= "user.png" 
               className="chat-message-profile"
              />
            )}
          </div>
        );
      }
      
      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
         const containerElement = chatMessagesRef.current;
         if (containerElement) {
           containerElement.scrollTop = containerElement.scrollHeight;
          }
        }, [chatMessages]);
        return (
          <div className="chat-messages-container" 
           ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message}
                  sender={chatMessage.sender} 
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);
       //const [chatMessages, setChatMessages] = array;
       /*shortcut(we used array destructuring above instead of this two lines of code) =>const chatMessages = array[0];
       const setChatMessages = array[1];
       */

        return (
          <div className="app-container">
            {chatMessages.length === 0 && (
              <div className="app-welcome-message">
                Welcome to the Chatbot Project! Send a message using the textbox below
              </div>
            )}
            <ChatMessages 
             chatMessages={chatMessages}
            />
            <ChatInput 
             chatMessages={chatMessages}
             setChatMessages={setChatMessages}
            />
          </div>
        );
      }

     
  
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
